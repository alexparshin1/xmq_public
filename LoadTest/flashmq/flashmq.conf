# https://www.flashmq.org/documentation/config-file/
# Tuned for benchmarking - see LoadTest/flashmq/flashmq.conf in the XMQ repository.

log_file /var/log/flashmq/flashmq.log

# Logging is per-connection and per-publish at the lower levels. At 500k connections and
# 50k msg/s that would be the measurement writing to disk rather than the broker serving.
log_level warning
log_subscriptions false
log_publishes false

# One worker per vCPU. Auto-detect already picks this on this host; stated so the results
# record what was measured rather than what the machine happened to have.
thread_count 16

# The defaults (512 messages / 64 kB per client) drop QoS 1 traffic when a subscriber falls
# behind, which in a fan-out run would show up as throughput the broker never delivered.
# Raised past anything these scenarios can queue, matching how Mosquitto was configured for
# the same runs.
max_qos_msg_pending_per_client 65535
max_qos_bytes_pending_per_client 268435456

listen {
  protocol mqtt
  inet_protocol ip4
  port 1885
  allow_anonymous true
  tcp_nodelay     true
}
