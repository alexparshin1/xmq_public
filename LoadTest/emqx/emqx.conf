## Place read-only configurations in this file.
## To define configurations that can later be overridden through UI/API/CLI, add them to `etc/base.hocon`.
##
## Config precedence order:
##   etc/base.hocon < cluster.hocon < emqx.conf < environment variables
##
## See https://www.emqx.io/docs/en/latest/configuration/configuration.html for more information.
## Configuration full example can be found in etc/examples

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "/var/lib/emqx"

  # Capacity for ~1M connections
  process_limit = 4194304
  max_ports     = 2097152
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        # Each broker on this host owns a port triple: XMQ 1883/8883/18883,
        # mosquitto 1884/8884, EMQX 1882/8882/18882.
        http.bind = 18882
        # https.bind = 18084
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

# XMQ owns the standard MQTT ports 1883/8883 on this host, so EMQX takes 1882/8882.
# Without the ssl listener named explicitly, EMQX would default it to 8883 and take the
# port XMQ needs for MQTT+SSL.
listeners.ssl.default {
    bind            = "0.0.0.0:8882"
}

listeners.tcp.default {
    bind            = "0.0.0.0:1882"
    max_connections = 2000000
    acceptors       = 64
    tcp_options {
        backlog   = 8192
        buffer    = 4KB
        keepalive = "120,30,3"
    }
}

## Limits raised for high-rate QoS 1 subscribers (2026-10-07). At the defaults EMQX closes a subscriber
## whose process mailbox exceeds 1000 messages (force_shutdown) and drops what overflows a 1000-message
## session queue - both happened in the Fan-In scenario, 100 messages a second per subscriber.
mqtt {
  max_inflight = 128
  max_mqueue_len = 100000
}
force_shutdown {
  enable = true
  max_mailbox_size = 100000
}
