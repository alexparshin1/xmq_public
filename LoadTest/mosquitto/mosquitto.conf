# Mosquitto configuration for the 1M-connection load test.
# Coexists with XMQ (1883), EMQX (1882) and NanoMQ (1881) on this host. XMQ takes the
# standard MQTT port 1883, so mosquitto moves one up to 1884
# (see ../nanomq/nanomq_install.sh and ../emqx/emqx.conf).
#
# THROUGHPUT CEILING: mosquitto runs a single event-loop thread, so no amount of tuning
# below gets it past one core. Measured on a 4-core Skylake host (20K connections, QoS 0,
# point-to-point): 20K msg/s at 226us using 0.70 cores, then 30K msg/s collapses to 634ms
# with CPU pinned at 0.98 cores. The knee is the thread, not any setting here.
#
# Per message it is the most efficient of the three brokers - ~35us of CPU, against XMQ's
# ~124us and EMQX's ~499us on the same host - it simply cannot spread that work. Expect
# roughly one core's worth on any machine: faster cores raise the ceiling, more cores do not.

listener 1884 0.0.0.0

allow_anonymous true

# Mosquitto defaults this to false, leaving Nagle's algorithm enabled on client sockets.
# Measured on a 4-core Skylake host (1K pairs, 1 msg/s each, QoS 0): 457us with Nagle on vs 410us with it
# off - about 10%. Smaller than it first appears, because Nagle only delays while a small
# segment is still unacknowledged, and a publisher sending once per second is idle in
# between. The gap should widen with several messages in flight per connection, and it costs
# nothing, so it is on for the benchmark.
set_tcp_nodelay true

# Unlimited at the broker level — the real ceiling is OS file descriptors, tuned via
# the systemd drop-in (mosquitto-override.conf) and the sysctl steps in
# 1M-Connection-Test-Plan.md section 4. Mosquitto has no listener-level backlog/acceptor
# config (unlike EMQX's listeners.tcp.default.tcp_options.backlog), so
# net.core.somaxconn is the only lever for the accept queue here too.
max_connections -1

# Disabled for the load test: with clean_session=true sessions and 1M connections,
# periodic autosave snapshots to disk would add I/O the benchmark isn't meant to
# measure. Re-enable (and set persistence_location) if testing durability instead.
persistence false

# Mosquitto's default is 20 in-flight QoS1/2 messages per client and a 1000-message
# queue behind that - fine for a handful of clients, but at tens of thousands of
# concurrent publishers each sending steadily, that cap serializes delivery and the
# per-client backlog grows without bound (observed: P2P 35K latency climbing from 2s
# to 44s over 108s of publishing). Unlimited here to match what the benchmark is
# actually trying to measure - broker throughput, not an artificial queue-depth cap.
#
# Bounding it does not rescue an overloaded broker. Measured on a 4-core Skylake host (20K connections,
# QoS 1) with max_inflight_messages at 0 / 1000 / 100: at 10K msg/s all three sit at
# 225-262us, and at 20K msg/s all three collapse to 4.1-5.7s with CPU pinned at exactly
# 1.00 cores. Backpressure helps when latency climbs while CPU still has headroom; here
# the single event-loop thread is already saturated, and the limit only throttles delivery
# to subscribers while publishers keep sending, so incoming work is unchanged.
max_inflight_messages 0
max_queued_messages 0

log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning

# Read drop-ins from /etc/mosquitto/conf.d. Without this the packaged default's include is
# lost when this file replaces it, and every drop-in - the TLS listener among them - is
# silently ignored. Kept last: options in the included files apply to the listener that
# precedes them, so a drop-in defining its own listener must come after this one.
include_dir /etc/mosquitto/conf.d
