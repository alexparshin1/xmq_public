# systemd drop-in: deployed to /etc/systemd/system/mosquitto.service.d/override.conf.
# A drop-in (not a full unit replacement) so we keep the packaged unit's
# User=mosquitto/hardening directives and only add what's missing.
[Service]
# Matches the server-side ulimit target in 1M-Connection-Test-Plan.md section 4, and
# the same fix applied to NanoMQ in ../nanomq/nanomq.service — Debian's packaged
# mosquitto.service sets no LimitNOFILE, so a fresh host's systemd default (~1024
# soft) would cap connections far below 1M.
LimitNOFILE=1200000
