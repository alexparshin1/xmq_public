fs.file-max = 2097152
fs.nr_open=2097152

# Accept queue depth. The kernel applies min(listen() backlog, somaxconn), so this only
# helps if the application asks for at least as much: SPTK's FastTCPServer defaults to a
# 4096 backlog, so raise its backlog parameter too if a deeper queue is actually wanted.
# Measured: at 2500 connections/s a 4096 backlog never overflowed
# (TcpExtListenOverflows = 0 across a full 500K run), so this is headroom for higher
# connection rates rather than a fix for an observed drop.
net.core.somaxconn=65535
net.ipv4.tcp_max_syn_backlog=65535
net.core.netdev_max_backlog=16384

net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.optmem_max=16777216

# Global ceiling on TCP buffer memory, in PAGES (4Kb), as low/pressure/high.
# Above "pressure" the kernel starts moderating per-socket buffers; above "high" it
# refuses allocations and drops - which at high connection counts looks exactly like a
# broker fault. Sized here for 1M connections: 4Gb/6Gb/8Gb.
#
# The kernel default is derived from RAM and comes out near 1.4Gb/1.9Gb/2.8Gb on a 30Gb
# host. That is ample for connection-count tests - measured use stayed under 1437 pages
# (5.6Mb) through a full 1M-connection run, because idle sockets hold almost no buffer
# memory - but it is low for message-passing scenarios at high connection counts.
#
# Do NOT quote these values: sysctl does not strip quotes, so a quoted setting fails to
# apply. That is why the tcp_mem line here was previously commented out and the
# tcp_rmem/tcp_wmem lines are unquoted.
net.ipv4.tcp_mem = 1048576 1572864 2097152
net.ipv4.tcp_rmem = 1024 4096 16777216
net.ipv4.tcp_wmem = 1024 4096 16777216

net.nf_conntrack_max=1000000
net.netfilter.nf_conntrack_max=1000000
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30

# Closing 1M connections at the end of a run leaves an enormous number of sockets in
# TIME_WAIT. Without these, the next run cannot allocate source ports for several minutes.
# tcp_tw_reuse must be 1, not 2: on kernels 5.10+ the value 2 restricts reuse to loopback
# traffic only, which does nothing for a client connecting to a separate broker host.
# These match what run_load_test.sh --apply-sysctl sets at runtime.
net.ipv4.tcp_tw_reuse=1
net.ipv4.tcp_max_tw_buckets=2000000
net.ipv4.tcp_fin_timeout=15

# nf_conntrack must be loaded before systemd-sysctl runs, or the two
# nf_conntrack_max settings above are silently discarded and the module later comes up
# with its own RAM-derived default (262144 on a 30Gb host). See
# /etc/modules-load.d/nf_conntrack.conf. Verify with:
#     sysctl -n net.netfilter.nf_conntrack_max
