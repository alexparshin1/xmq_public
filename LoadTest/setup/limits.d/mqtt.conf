# Raise the open-file limit for MQTT load testing (xmq_scn) and xmq_server.
# Install to /etc/security/limits.d/mqtt.conf (takes effect on next login).
# Matches the fs.nr_open ceiling in ../sysctl.d/mqtt.conf and the --apply-sysctl
# defaults in run_load_test.sh.
#
# Measured need: one fd per connection plus a small fixed overhead. xmq_server idles at
# 17 fds, so a 1M-connection run needs 1000017 - a limit of exactly 1000000 fails, which
# is how the 2026-07-29 run stalled at 499983 (= 500000 - 17). 2000000 leaves headroom
# for 1M plus the listener/epoll/Redis descriptors.
#
# NOTE: this file only applies to PAM login sessions. systemd services get
# DefaultLimitNOFILE instead (often 524288), which is enough for 500K but NOT for
# 1M. A systemd-run or unit-based launch must set LimitNOFILE explicitly.
#
# NOTE: a per-user "ulimit -n" in ~/.profile or ~/.bashrc overrides this downward and
# cannot be raised again by an unprivileged process. See README.md.

*               soft    nofile          2000000
*               hard    nofile          2000000
