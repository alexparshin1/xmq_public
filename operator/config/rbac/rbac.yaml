apiVersion: v1
kind: Namespace
metadata:
  name: xmq-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xmq-operator-controller-manager
  namespace: xmq-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xmq-operator-manager-role
rules:
  - apiGroups: [xmq.sptk.net]
    resources: [xmqclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [xmq.sptk.net]
    resources: [xmqclusters/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps, services, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xmq-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xmq-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: xmq-operator-controller-manager
    namespace: xmq-operator-system
