apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xmqclusters.xmq.sptk.net
spec:
  group: xmq.sptk.net
  scope: Namespaced
  names:
    plural: xmqclusters
    singular: xmqcluster
    kind: XMQCluster
    shortNames: [xmq]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [version, redisURI, databaseURI, caSecret, tlsSecretPrefix, credentialsSecret]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3
                version:
                  type: string
                  description: XMQ version. The operator supports 1.2.1.
                image:
                  type: string
                redisURI:
                  type: string
                databaseURI:
                  type: string
                caSecret:
                  type: string
                tlsSecretPrefix:
                  type: string
                credentialsSecret:
                  type: string
                enablePersistence:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer, format: int64}
      subresources:
        status: {}
